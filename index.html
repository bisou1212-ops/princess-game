<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfe6ff" />
    <meta name="description" content="로은이의 공주 왕국" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="공주 왕국" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>로은이의 공주 왕국</title>
    <style>
      /* overscroll-behavior: 목록을 끌다가 맨 위에서 당겨도 페이지가 새로고침(당겨서 새로고침)되지 않게 */
      html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      /* 그림을 길게 누르면 뜨는 "이미지 저장" 메뉴·끌기 막기 (그림 위를 눌러도 버튼이 눌림) */
      img { pointer-events: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
    </style>
    <script>
      // 배포 직후에는 게임 파일(assets/*.js)을 잠깐 못 받을 수 있다(404가 캐시되기도 함).
      // 그러면 화면이 빈 채로 멈추므로, 한 번만 캐시를 건너뛰고 다시 불러온다.
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (!t || t.tagName !== 'SCRIPT' || sessionStorage.getItem('reloadedForAsset')) return;
        sessionStorage.setItem('reloadedForAsset', '1');
        fetch(t.src, { cache: 'reload' }).finally(function () { location.reload(); });
      }, true);
      window.addEventListener('load', function () { setTimeout(function () { sessionStorage.removeItem('reloadedForAsset'); }, 5000); });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
